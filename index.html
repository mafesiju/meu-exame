<!doctype html><html lang='pt-BR'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='theme-color' content='#f6f2e8'><title>Meu Exame</title><link rel='manifest' href='manifest.json'><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#28241f;background:#f6f2e8}body{margin:0}.app{max-width:680px;margin:auto;min-height:100vh;background:#fffdf8;padding:22px;box-sizing:border-box}h1{text-align:center;margin:8px 0 4px}h2{margin-top:10px}.sub{text-align:center;color:#6d655d;margin-bottom:26px}.btn{display:block;width:100%;padding:16px;margin:12px 0;border:0;border-radius:14px;background:#574536;color:white;font-size:17px;font-weight:700}.secondary{background:#e9e1d5;color:#352d26}.danger{background:#7a3939}.back{background:none;border:0;font-size:16px;padding:8px 0}.hidden{display:none}.search,textarea{width:100%;box-sizing:border-box;padding:13px;border:1px solid #cfc5b8;border-radius:12px;font-size:16px;margin:8px 0 14px}.row{display:flex;align-items:center;gap:8px;border-bottom:1px solid #eee4d8;padding:10px 0}.name{flex:1;background:none;border:0;text-align:left;font-size:16px;padding:8px}.info{border:0;border-radius:50%;width:34px;height:34px;font-weight:bold}.card{background:#f7f1e8;border-radius:14px;padding:14px;margin:10px 0}.muted{color:#776f67;font-size:14px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#2f2a25;color:white;padding:10px 16px;border-radius:20px;display:none}.count{font-weight:700}.small{font-size:14px}.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:20px}.modal.hidden{display:none}.box{max-width:520px;width:100%;background:white;border-radius:18px;padding:20px;box-sizing:border-box}.actions{display:flex;gap:8px}.actions .btn{margin:6px 0}.suggest{border:1px solid #ded3c5;border-radius:12px;padding:12px;margin:8px 0;background:white;width:100%;text-align:left;font-size:16px}
</style></head><body><main class='app'>
<section id='home'><h1>✝️ Meu Exame</h1><p class='sub'>Preparação simples para a confissão</p><button class='btn' onclick="show('register')">➕ Registrar pecado</button><button class='btn secondary' onclick="show('classify')">🔎 Não sei classificar</button><button class='btn secondary' onclick="renderConfession();show('confession')">📖 Minha Confissão</button><p class='muted' style='text-align:center;margin-top:30px'>Os registros ficam somente neste navegador/aparelho.</p></section>
<section id='register' class='hidden'><button class='back' onclick="show('home')">← Voltar</button><h2>Registrar</h2><input id='search' class='search' placeholder='Buscar pecado...' oninput='renderList()'><div id='list'></div></section>
<section id='classify' class='hidden'><button class='back' onclick="show('home')">← Voltar</button><h2>Não sei classificar</h2><p>Descreva brevemente o que aconteceu. O aplicativo mostrará apenas sugestões.</p><textarea id='description' rows='5' placeholder='Ex.: Falei mal de uma pessoa pelas costas...'></textarea><button class='btn' onclick='suggest()'>Ver sugestões</button><div id='suggestions'></div></section>
<section id='confession' class='hidden'><button class='back' onclick="show('home')">← Voltar</button><h2>Minha Confissão</h2><p class='muted'>Registros desde a última confissão.</p><div id='summary'></div><button class='btn danger' onclick='finishConfession()'>✓ Confissão realizada</button></section>
</main><div id='modal' class='modal hidden'><div class='box' id='modalbox'></div></div><div id='toast' class='toast'></div>
<script>
const sins = [
'Soberba','Avareza','Luxúria','Ira','Gula','Inveja','Preguiça','Idolatria','Superstição','Ateísmo','Sacrilégio','Magia e feitiçaria','Simonia (comércio do sagrado)','Blasfêmia','Perjúrio (mentir sob juramento)','Juramento falso','Profanação do domingo','Negligência do culto e oração','Desobediência aos pais','Desrespeito às autoridades legítimas','Homicídio','Aborto','Eutanásia','Ódio','Vingança','Escândalo','Adultério','Fornicação','Prostituição','Impureza nos pensamentos ou olhares','Pornografia','Masturbação','Estupro','Homossexualidade praticada','Bestialidade','Roubo','Furto','Corrupção','Suborno','Usura','Fraude','Injustiça nos salários','Mentira','Difamação','Calúnia','Falsa testemunha','Fofoca e maledicência','Julgamento injusto','Impureza','Lascívia','Idolatria (moral)','Feitiçaria','Inimizades','Contendas','Ciúmes','Iras','Dissensões','Divisões (facções)','Invejas','Homicídios','Bebedices','Glutonarias','Incredulidade','Hipocrisia','Ingratidão','Escárnio das coisas sagradas','Escândalo','Obstinação no mal','Dureza de coração','Desesperança','Presunção de salvação','Falta de perdão','Murmuração','Malícia','Insolência','Orgulho espiritual','Avarento que nega esmola','Negligência no dever','Desobediência à voz de Deus','Falta de caridade','Pregação falsa','Covardia moral','Frieza espiritual','Desonestidade','Injustiça social','Desprezo pela vontade de Deus'];
const defs={
'Ira':'Raiva desordenada que pode levar a palavras, atitudes ou desejos contrários à caridade.','Murmuração':'Queixa ou crítica habitual que pode alimentar descontentamento e falta de caridade.','Fofoca e maledicência':'Divulgação desnecessária de faltas ou aspectos negativos de outra pessoa, prejudicando sua reputação.','Calúnia':'Atribuir falsamente a alguém uma falta ou delito, prejudicando sua reputação.','Difamação':'Prejudicar a reputação de alguém por afirmações ou divulgação indevida de fatos.','Mentira':'Dizer deliberadamente algo contrário ao que se considera verdadeiro, com intenção de enganar.','Falta de caridade':'Agir ou omitir-se de modo contrário ao amor devido a Deus e ao próximo.','Julgamento injusto':'Formar ou sustentar, sem fundamento suficiente, um juízo moral desfavorável sobre outra pessoa.','Ódio':'Desejo deliberado de mal ao próximo ou rejeição grave da caridade para com ele.','Vingança':'Desejo ou ato de retribuir um mal recebido por meio de outro mal.','Gula':'Uso desordenado de comida ou bebida, contrário à temperança.','Inveja':'Tristeza diante do bem alheio ou desejo desordenado de possuí-lo ou vê-lo diminuído.','Soberba':'Exaltação desordenada de si mesmo e recusa da devida dependência de Deus e consideração pelos outros.','Preguiça':'Negligência voluntária dos deveres ou resistência ao esforço devido; no sentido espiritual, pode incluir acídia.'};
const keywords={
'Ira':['raiva','gritei','gritar','furioso','explodi','paciência','irritado'], 'Murmuração':['reclamei','reclamar','resmunguei','queixei','murmurei'], 'Fofoca e maledicência':['fofoca','falei mal','pelas costas','espalhei','comentei da vida'], 'Calúnia':['inventei','acusação falsa','acusei falsamente','mentira sobre'], 'Difamação':['reputação','difamei','expor','espalhei verdade'], 'Mentira':['menti','mentira','enganei','enganar'], 'Ódio':['odeio','odiei','desejei mal','queria que sofresse'], 'Vingança':['vingança','me vingar','dar o troco','fazer pagar'], 'Julgamento injusto':['julguei','julgar','condenei sem saber','presumi'], 'Falta de caridade':['sem caridade','não ajudei','indiferença','desprezei'], 'Ciúmes':['ciúme','ciumes','ciumento'], 'Inveja':['inveja','invejei'], 'Gula':['comi demais','gula','exagerei na comida'], 'Bebedices':['bebi demais','embriaguei','bêbado','bebado'], 'Preguiça':['preguiça','procrastinei','deixei de fazer']};
let records=JSON.parse(localStorage.getItem('meuExameRecords')||'[]');
function save(){localStorage.setItem('meuExameRecords',JSON.stringify(records))}function show(id){document.querySelectorAll('main section').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');if(id==='register')renderList()}
function renderList(){let q=(document.getElementById('search').value||'').toLowerCase();let a=sins.filter(s=>s.toLowerCase().includes(q)).sort((a,b)=>a.localeCompare(b,'pt-BR'));document.getElementById('list').innerHTML=a.map(s=>`<div class='row'><button class='name' onclick='openRegister(${JSON.stringify(s)})'>${s}</button><button class='info' onclick='openInfo(${JSON.stringify(s)})'>ⓘ</button></div>`).join('')}
function openInfo(s){document.getElementById('modalbox').innerHTML=`<h2>${s}</h2><p>${defs[s]||'Definição resumida ainda será acrescentada nesta versão de teste.'}</p><p class='muted'>Esta explicação serve como auxílio ao exame de consciência e não determina, por si só, culpa ou gravidade.</p><div class='actions'><button class='btn secondary' onclick='closeModal()'>Voltar</button><button class='btn' onclick='closeModal();openRegister(${JSON.stringify(s)})'>Registrar</button></div>`;document.getElementById('modal').classList.remove('hidden')}
function openRegister(s){document.getElementById('modalbox').innerHTML=`<h2>${s}</h2><p>Registrar esta ocorrência?</p><textarea id='note' rows='3' placeholder='Observação (opcional)'></textarea><div class='actions'><button class='btn secondary' onclick='closeModal()'>Cancelar</button><button class='btn' onclick='addRecord(${JSON.stringify(s)})'>✓ Registrar</button></div>`;document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}function addRecord(s){let n=document.getElementById('note')?.value||'';records.push({sin:s,note:n,date:new Date().toISOString()});save();closeModal();toast(s+' registrado');show('home')}
function toast(t){let e=document.getElementById('toast');e.textContent='✓ '+t;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}
function suggest(){let t=document.getElementById('description').value.toLowerCase();let scores=[];for(let [sin,ks] of Object.entries(keywords)){let score=ks.reduce((n,k)=>n+(t.includes(k)?1:0),0);if(score)scores.push([sin,score])}scores.sort((a,b)=>b[1]-a[1]);let top=scores.slice(0,5);document.getElementById('suggestions').innerHTML=top.length?'<h3>Possíveis pecados relacionados</h3>'+top.map(([s])=>`<button class='suggest' onclick='openRegister(${JSON.stringify(s)})'><b>${s}</b> &nbsp; ⓘ</button>`).join(''):`<div class='card'>Não encontrei uma sugestão clara. Use “Registrar pecado” e consulte a lista.</div>`}
function renderConfession(){let g={};records.forEach(r=>(g[r.sin]??=[]).push(r));let keys=Object.keys(g).sort((a,b)=>a.localeCompare(b,'pt-BR'));document.getElementById('summary').innerHTML=keys.length?keys.map(s=>`<div class='card' onclick='details(${JSON.stringify(s)})'><span class='count'>${s} — ${g[s].length} ${g[s].length===1?'vez':'vezes'}</span><div class='muted'>Toque para ver os registros</div></div>`).join(''):`<div class='card'>Nenhum pecado registrado neste período.</div>`}
function details(s){let rs=records.filter(r=>r.sin===s);document.getElementById('modalbox').innerHTML=`<h2>${s} — ${rs.length} ${rs.length===1?'vez':'vezes'}</h2>`+rs.map(r=>{let d=new Date(r.date);return `<div class='card'><b>${d.toLocaleDateString('pt-BR')} ${d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</b><div class='small'>${r.note||'Sem observação.'}</div></div>`}).join('')+`<button class='btn secondary' onclick='closeModal()'>Voltar</button>`;document.getElementById('modal').classList.remove('hidden')}
function finishConfession(){if(!records.length){toast('Nenhum registro para arquivar');return}if(confirm('Encerrar este período? Os registros atuais serão arquivados e uma nova preparação será iniciada.')){let hist=JSON.parse(localStorage.getItem('meuExameHistory')||'[]');hist.push({finished:new Date().toISOString(),records});localStorage.setItem('meuExameHistory',JSON.stringify(hist));records=[];save();renderConfession();toast('Novo período iniciado')}}
renderList();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
